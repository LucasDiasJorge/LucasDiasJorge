name: Update Commit Streak

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate streak SVG
        env:
          # Prefer STREAK_TOKEN (for private contributions). The script will
          # retry with GITHUB_TOKEN if GH_TOKEN is invalid or lacks access.
          GH_TOKEN: ${{ secrets.STREAK_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_USERNAME: LucasDiasJorge
        run: node scripts/generate-streak-svg.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/streak-stats.svg
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "chore: update commit streak stats"
          git pull --rebase origin main
          git push origin HEAD:main
